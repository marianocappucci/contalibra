{% extends "base.html" %}
{% block title %}{% if cliente %}Editar Cliente{% else %}Nuevo Cliente{% endif %} — Contalibra{% endblock %}
{% block content %}
<div class="page-header">
  <h1><i class="bi bi-person me-2 text-primary"></i>{% if cliente %}Editar cliente{% else %}Nuevo cliente{% endif %}</h1>
  <a href="/clientes" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Volver</a>
</div>

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<div class="card" style="max-width: 600px;">
  <div class="card-body">
    <form method="post" action="{% if cliente %}/clientes/{{ cliente.id }}/editar{% else %}/clientes/nuevo{% endif %}">
      <div class="mb-3">
        <label class="form-label fw-semibold">Nombre / Razón social <span class="text-danger">*</span></label>
        <input type="text" class="form-control" name="name" value="{{ cliente.name if cliente else '' }}" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">CUIT / DNI</label>
        <input type="text" class="form-control" name="cuit_dni" value="{{ cliente.cuit_dni if cliente else '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Domicilio</label>
        <input type="text" class="form-control" name="address" value="{{ cliente.address if cliente else '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input type="email" class="form-control" name="email" value="{{ cliente.email if cliente else '' }}">
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Teléfono</label>
        <input type="text" class="form-control" name="phone" value="{{ cliente.phone if cliente else '' }}">
      </div>
      <div class="d-flex gap-2">
        <a href="/clientes" class="btn btn-outline-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary fw-semibold px-4">
          <i class="bi bi-save me-1"></i>{% if cliente %}Guardar cambios{% else %}Crear cliente{% endif %}
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
