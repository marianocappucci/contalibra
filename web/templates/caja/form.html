{% extends "base.html" %}
{% block title %}Nuevo movimiento — Caja — Contalibra{% endblock %}
{% block content %}
<div class="page-header">
  <h1><i class="bi bi-cash-stack me-2 text-success"></i>Nuevo movimiento de caja</h1>
  <a href="/caja" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Volver</a>
</div>

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<div class="card" style="max-width: 560px;">
  <div class="card-body">
    <form method="post" action="/caja/nuevo">
      {% if factura_id %}
      <input type="hidden" name="factura_id" value="{{ factura_id }}">
      {% endif %}

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Tipo <span class="text-danger">*</span></label>
          <div class="d-flex gap-3 pt-1">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="tipo" id="tipo-ingreso"
                     value="ingreso" {% if tipo == 'ingreso' %}checked{% endif %}>
              <label class="form-check-label text-success fw-semibold" for="tipo-ingreso">
                <i class="bi bi-arrow-down-circle me-1"></i>Ingreso
              </label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="tipo" id="tipo-egreso"
                     value="egreso" {% if tipo == 'egreso' %}checked{% endif %}>
              <label class="form-check-label text-danger fw-semibold" for="tipo-egreso">
                <i class="bi bi-arrow-up-circle me-1"></i>Egreso
              </label>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Fecha <span class="text-danger">*</span></label>
          <input type="date" class="form-control" name="fecha" id="fecha" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Concepto <span class="text-danger">*</span></label>
        <input type="text" class="form-control" name="concepto"
               value="{{ concepto }}" placeholder="Ej: Cobro factura cliente / Pago servicios" required>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Monto <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text">$</span>
            <input type="number" class="form-control" name="monto" min="0.01" step="0.01"
                   value="{{ monto }}" required>
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Referencia</label>
          <input type="text" class="form-control" name="referencia"
                 placeholder="Opcional — N° factura, proveedor, etc.">
        </div>
      </div>

      <div class="d-flex gap-2">
        <a href="{% if factura_id %}/facturas/{{ factura_id }}{% else %}/caja{% endif %}"
           class="btn btn-outline-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary fw-semibold px-4">
          <i class="bi bi-save me-1"></i>Guardar movimiento
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  const f = document.getElementById('fecha');
  if (f && !f.value) f.value = new Date().toISOString().slice(0, 10);
</script>
{% endblock %}
