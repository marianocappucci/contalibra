<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contalibra — Ingresar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/vendor/material-symbols/material-symbols-outlined.css" rel="stylesheet">
  <style>
    body { background: #1a1a2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { width: 100%; max-width: 380px; border-radius: 16px; border: none; box-shadow: 0 4px 24px rgba(0,0,0,.3); }
    .login-brand { font-size: 1.6rem; font-weight: 700; color: #1a1a2e; letter-spacing: .03em; }
  </style>
</head>
<body>
  <div class="card login-card p-4">
    <div class="text-center mb-4">
      <span class="material-symbols-outlined fs-1 text-primary">storefront</span>
      <div class="login-brand mt-1">Contalibra</div>
    </div>
    {% if error %}
    <div class="alert alert-danger py-2 small">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
      <div class="mb-3">
        <label class="form-label fw-semibold">Usuario</label>
        <input type="text" name="username" class="form-control" autofocus autocomplete="username" required>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Contraseña</label>
        <div class="input-group">
          <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required>
          <button type="button" class="btn btn-outline-secondary" id="toggle-password" aria-label="Mostrar contraseña">
            <span class="material-symbols-outlined" id="toggle-password-icon">visibility</span>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 fw-semibold">Ingresar</button>
    </form>
  </div>
  <script>
    document.getElementById('toggle-password').addEventListener('click', function () {
      const input = document.getElementById('password');
      const icon = document.getElementById('toggle-password-icon');
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      icon.textContent = isHidden ? 'visibility_off' : 'visibility';
      this.setAttribute('aria-label', isHidden ? 'Ocultar contraseña' : 'Mostrar contraseña');
    });
  </script>
</body>
</html>
