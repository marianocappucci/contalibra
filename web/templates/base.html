<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Contalibra{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f4f6fb; }
    .sidebar {
      min-height: 100vh;
      background: #1a1a2e;
      color: #e0e0e0;
      width: 220px;
      flex-shrink: 0;
    }
    .sidebar .brand {
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
      padding: 1.5rem 1.2rem 1rem;
      letter-spacing: 0.03em;
      border-bottom: 1px solid #2d2d4e;
    }
    .sidebar .nav-link {
      color: #b0b8d4;
      border-radius: 8px;
      margin: 2px 8px;
      padding: 0.55rem 1rem;
      font-size: 0.95rem;
    }
    .sidebar .nav-link:hover, .sidebar .nav-link.active {
      background: #2d2d4e;
      color: #fff;
    }
    .sidebar .nav-link i { margin-right: 8px; font-size: 1.05rem; }
    .main-content { flex: 1; min-width: 0; padding: 2rem; }
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .page-header h1 { font-size: 1.5rem; font-weight: 700; margin: 0; }
    .card { border: none; box-shadow: 0 1px 6px rgba(0,0,0,.07); border-radius: 12px; }
    .card-header { background: transparent; border-bottom: 1px solid #f0f0f0; font-weight: 600; }
    .table th { font-size: 0.82rem; text-transform: uppercase; letter-spacing: .04em; color: #666; }
    .badge-pendiente { background: #fff3cd; color: #856404; }
    .badge-aceptado  { background: #d1e7dd; color: #0f5132; }
    .badge-rechazado { background: #f8d7da; color: #842029; }
    .logout-link { color: #b0b8d4; font-size: 0.85rem; padding: 0.5rem 1.2rem; display: block; }
    .logout-link:hover { color: #fff; }
    @media (max-width: 768px) {
      .sidebar { display: none; }
    }
  </style>
</head>
<body>
<div class="d-flex">
  <nav class="sidebar d-flex flex-column">
    <div class="brand"><i class="bi bi-journal-bookmark-fill me-2"></i>Contalibra</div>
    <ul class="nav flex-column mt-2 flex-grow-1">
      <li class="nav-item">
        <a class="nav-link {% if active == 'dashboard' %}active{% endif %}" href="/dashboard">
          <i class="bi bi-speedometer2"></i>Dashboard
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if active == 'remitos' %}active{% endif %}" href="/remitos">
          <i class="bi bi-file-earmark-text"></i>Remitos
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if active == 'presupuestos' %}active{% endif %}" href="/presupuestos">
          <i class="bi bi-calculator"></i>Presupuestos
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if active == 'facturas' %}active{% endif %}" href="/facturas">
          <i class="bi bi-receipt"></i>Facturas
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if active == 'clientes' %}active{% endif %}" href="/clientes">
          <i class="bi bi-people"></i>Clientes
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if active == 'caja' %}active{% endif %}" href="/caja">
          <i class="bi bi-cash-stack"></i>Caja
        </a>
      </li>
      <li class="nav-item mt-3">
        <a class="nav-link {% if active == 'config' %}active{% endif %}" href="/config">
          <i class="bi bi-gear"></i>Configuración
        </a>
      </li>
    </ul>
    <a href="/logout" class="logout-link mb-3"><i class="bi bi-box-arrow-left me-1"></i>Cerrar sesión</a>
  </nav>
  <div class="main-content">
    {% with messages = [] %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
