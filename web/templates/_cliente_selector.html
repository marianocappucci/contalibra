{# Selector de cliente reutilizable.
   Requiere en el contexto: clientes (lista), client_placeholder (opcional) #}
<div class="mb-3">
  <label class="form-label">Cliente</label>
  <div class="input-group">
    <select class="form-select" id="client-select" name="client_id">
      <option value="">{{ client_placeholder|default('— Consumidor Final —') }}</option>
      {% for c in clientes %}
      <option value="{{ c.id }}"
        data-address="{{ c.address or '' }}"
        data-cuit="{{ c.cuit_dni or '' }}"
        data-email="{{ c.email or '' }}"
        data-phone="{{ c.phone or '' }}"
        data-iva="{{ c.iva_condition or '' }}">{{ c.name }}</option>
      {% endfor %}
    </select>
    <button type="button" class="btn btn-outline-secondary" data-bs-toggle="modal"
            data-bs-target="#modal-nuevo-cliente" title="Agregar nuevo cliente">
      <i class="bi bi-person-plus"></i>
    </button>
  </div>
</div>
<input type="hidden" name="client_name"    id="client_name"    value="{{ client_default_name|default('') }}">
<input type="hidden" name="client_cuit"    id="client_cuit"    value="">
<input type="hidden" name="client_iva"     id="client_iva"     value="">
<input type="hidden" name="client_address" id="client_address" value="">
<input type="hidden" name="client_email"   id="client_email"   value="">
<input type="hidden" name="client_phone"   id="client_phone"   value="">
<div id="client-fields" class="border rounded p-2 bg-light d-none">
  <div class="fw-semibold"       id="cf-display-name"></div>
  <div class="small text-muted"  id="cf-display-cuit"></div>
  <div class="small text-muted"  id="cf-display-iva"></div>
  <div class="small text-muted"  id="cf-display-address"></div>
</div>
