[alembic]
script_location = migrations
# Placeholder a propósito: el destino real lo resuelve `migrations/env.py` con
# `url_de_instancia("contalibra")`, que es la misma fuente que usa la app para
# saber contra qué base corre. Si esta URL se usara, la cadena estaría migrando
# una base distinta de la que sirve el producto.
sqlalchemy.url = postgresql://user:password@localhost/contalibra

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
