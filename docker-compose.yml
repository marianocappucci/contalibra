services:
  contalibra:
    build: .
    container_name: contalibra
    restart: unless-stopped
    ports:
      - "8070:8000"
    volumes:
      - ./:/app         # mount completo para desarrollo (hot-reload)
    environment:
      - SECRET_KEY=${SECRET_KEY:-contalibra-secret-change-in-production}
      # Solo se usan en el primer arranque si la tabla usuarios está vacía:
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_NOMBRE=${ADMIN_NOMBRE:-Administrador}
    networks:
      - stack-net

networks:
  stack-net:
    external: true
    name: stack_stack-net
