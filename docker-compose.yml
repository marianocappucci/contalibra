services:
  contalibra:
    build: .
    container_name: contalibra
    restart: unless-stopped
    ports:
      - "8070:8000"
    volumes:
      - ./contalibra.db:/app/contalibra.db
      - ./remitos_pdf:/app/remitos_pdf
      - ./presupuestos_pdf:/app/presupuestos_pdf
      - ./config.json:/app/config.json
      - ./logos:/app/logos
      - ./web:/app/web
    environment:
      - APP_USER=${APP_USER:-admin}
      - APP_PASSWORD=${APP_PASSWORD:-cambiar_esta_clave}
      - SECRET_KEY=${SECRET_KEY:-contalibra-secret-change-in-production}
    networks:
      - stack-net

networks:
  stack-net:
    external: true
    name: stack_stack-net
