services:
  # El backend de la instancia de dev desde el corte a PostgreSQL.
  #
  # 🔴 La clave del servicio lleva el nombre del producto y no es `db` ni
  # `postgres`: `stack-net` es una red COMPARTIDA por todo el VPS y Compose
  # convierte la clave en un alias de red. Dos composes con la misma clave se
  # turnan por round-robin del DNS interno — ya pasó en esta familia.
  #
  # 🔴 Imagen Debian (`postgres:16`), la misma del CI: el collation viene de la
  # imagen y la alpine ordena por bytes, como SQLite.
  #
  # Una sola base, a diferencia de Gestiolibra y MedLibra: acá el core y el
  # dominio comparten schema, que es como ya convivían en el mismo archivo.
  #
  # Sin `ports:` a propósito: sólo se llega desde la red interna.
  contalibra-postgres:
    image: postgres:16
    command: postgres -c timezone=America/Argentina/Buenos_Aires
    container_name: contalibra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: contalibra
      POSTGRES_USER: contalibra
      # Sin default a propósito: `:?` aborta el `up` si falta, en vez de
      # levantar la base con una clave escrita en git.
      POSTGRES_PASSWORD: ${CONTALIBRA_POSTGRES_PASSWORD:?hay que definirla en el .env del VPS}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - contalibra-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contalibra -d contalibra"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - datos

  contalibra-dev:
    build:
      context: .
      # Este producto depende de TRES paquetes privados propios, y el
      # Dockerfile monta un id SSH separado para cada uno (GitHub autentica
      # toda la conexión con la primera deploy key que le ofrecen, así que
      # una sola key no alcanza). Los ids tienen que coincidir con los
      # `--mount=type=ssh,id=...` del Dockerfile y con lo que arma
      # `libracore.provisioning.docker_build_ssh_args()` para el build de
      # producción — ver wiki/entities/libracore.md.
      #
      # Declarar sólo `default` (como estaba hasta el 2026-07-28) hacía que
      # `docker compose build` fallara con `exit code 128` al clonar
      # libra-ui/libracommerce, así que la imagen de dev no se podía
      # reconstruir: se quedó congelada mientras el bind mount `./:/app`
      # seguía trayendo código nuevo, hasta que ese código importó un
      # paquete que la imagen vieja no tenía y uvicorn dejó de levantar.
      ssh:
        - default=${LIBRACORE_SSH_KEY:-~/.ssh/id_ed25519_libracore}
        - libracore=${LIBRACORE_SSH_KEY:-~/.ssh/id_ed25519_libracore}
        - libracommerce=${LIBRACOMMERCE_SSH_KEY:-~/.ssh/id_ed25519_libracommerce}
        - libraauth=${LIBRAAUTH_SSH_KEY:-~/.ssh/id_ed25519_libraauth}
        - libra-ui=${LIBRA_UI_SSH_KEY:-~/.ssh/id_ed25519_libra_ui}
    container_name: contalibra-dev
    depends_on:
      contalibra-postgres:
        condition: service_healthy
    restart: unless-stopped
    # Límites agregados tras cruzar la auditoría de Restolibra (ver
    # wiki/analyses/restolibra-auditoria-produccion): sin esto, un contenedor
    # de Contalibra sin tope puede consumir toda la RAM/CPU del VPS y tumbar
    # a Restolibra (y viceversa), que comparten el mismo host.
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 1.0
    # Sin privilegios nuevos (2026-10-15, relevamiento de seguridad de la VPS, punto 8):
    # un binario setuid (o con capabilities de archivo) dentro de la imagen no le da a
    # un proceso comprometido más permisos que los que ya tiene. La imagen ya corre como
    # uid 10001 (ver el `USER` del Dockerfile); esto cierra la escalada.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # 🔴 El chequeo mira el CUERPO, no el codigo HTTP. Este backend sirve la SPA
      # con un catch-all, asi que **cualquier** ruta devuelve 200 mientras uvicorn
      # sirva estaticos: un `urlopen()` a secas da healthy con la API muerta, y da
      # healthy tambien apuntado a una ruta inventada. Medido el 2026-08-12 por
      # `docker exec` en los 21 contenedores del VPS: los 21 daban exit 0 contra una
      # ruta que no existe. Un chequeo que no puede fallar no es un chequeo.
      #
      # `json.load` sobre el index.html revienta, que es exactamente lo que se busca.
      # `isinstance(..., dict)` y no una clave concreta porque el cuerpo difiere
      # entre productos; es ademas lo que emite el generador de instancias de
      # LibraCore (PR #82), asi que dev y las instancias no divergen.
      test: ["CMD", "python3", "-c", "import json,urllib.request; assert isinstance(json.load(urllib.request.urlopen('http://localhost:8000/health', timeout=3)), dict)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "127.0.0.1:8071:8000"
    volumes:
      # El código va **horneado en la imagen**, igual que en LibraDesk: este contenedor
      # no monta el checkout, así que no ve `clientes/` ni el `.env`. Lo único que se monta
      # es la carpeta de datos de dev (config, certificados, logos, PDF), que vive en
      # `dev-data/` del checkout del servidor. Un cambio de código llega con
      # `docker compose up -d --build`, que es como se despliega dev.
      # 🔴 El proceso corre como uid 10001: `./dev-data` tiene que ser de ese uid. Un bind mount
      # que ya existe conserva su dueño (root), y la app no podría escribir ahí. Una sola vez, en
      # el checkout del VPS, ANTES del primer `up -d --build` con esta imagen:
      #   chown -R 10001:10001 ./dev-data
      - ./dev-data:/app/dev-data
    # 🔴 Las migraciones también acá, no sólo en el deploy.
    # `cmd_actualizar` las corre para las instancias de cliente y la demo,
    # pero ESTA la levanta el compose del repo y el motor no la toca. Tiene
    # que decir LO MISMO que `migraciones` en los dos scripts de `scripts/`;
    # hay un test que ata las dos puntas.
    #
    # `exec` para que uvicorn quede como PID 1 y `docker stop` le llegue.
    #
    # `--workers ${WEB_CONCURRENCY:-1}`: el codigo esta listo para varios procesos (libracore ADR-044, libraauth ADR-023)
    # pero **todo sigue en 1**; subirlo es una decision aparte (`docs/varios-procesos.md` de libracore).
    command: sh -c "libracore-migrar upgrade --prefijo contalibra && libraauth-migrar upgrade --prefijo contalibra --base dominio && libracommerce-migrar upgrade --prefijo contalibra && alembic upgrade head && exec uvicorn app.asgi:app --host 0.0.0.0 --port 8000 --workers ${WEB_CONCURRENCY:-1}"
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY es obligatorio tambien en dev (sin default en un repo publico)}
      - TZ=America/Argentina/Buenos_Aires
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_NOMBRE=${ADMIN_NOMBRE:-Administrador}
      - DATA_DIR=/app/dev-data
      # 🔴 El corte a PostgreSQL. Esta variable gana sobre la ruta derivada de
      # DATA_DIR (ver app/db_core.py) y es lo único que mueve la instancia de
      # motor.
      #
      # Rollback: comentar esta línea y reiniciar. El `.db` sigue en
      # `dev-data/` sin tocar — la migración copia, no mueve.
      - CONTALIBRA_DATABASE_URL=postgresql://contalibra:${CONTALIBRA_POSTGRES_PASSWORD:?hay que definirla en el .env del VPS}@contalibra-postgres:5432/contalibra
      - ENV=development
      - DOCS_AUTH_SECRET=${DOCS_AUTH_SECRET:-}
      # 🔴 El token con el que ESTA instancia acepta llamadas de otro producto
      # de la familia. Hoy lo usa el puente de MedLibra: el consultorio cierra
      # un turno y lo manda a `POST /api/integraciones/consultas`, que es donde
      # vive la contabilidad.
      #
      # 🔑 **Default VACÍO, y es la defensa.** Sin esta variable
      # `token_de_servicio_valido` devuelve `False` **sin mirar el header**, así
      # que los endpoints que aceptan "admin o servicio" se comportan como si
      # sólo aceptaran admin. Un default con un valor real en el repo le daría
      # acceso de servicio a cualquiera que lo lea, y `dev.contalibra.com.ar` es
      # público. El valor vive en el `.env` del VPS, como el resto de los
      # secretos de esta instancia.
      #
      # ⚠️ Del otro lado la variable se llama distinto —MedLibra y LibraDesk la
      # mandan como `CONTALIBRA_SERVICE_TOKEN`, y desde libraauth v0.52.0 su
      # valor es el `LIBRA_INTEGRACION_TOKEN` de abajo— y es a propósito: son dos permisos, el que
      # nosotros aceptamos y el que a ellos les dejamos usar. Compartir el
      # nombre haría que rotar uno rote el otro sin que nadie lo pida.
      - LIBRA_SERVICE_TOKEN=${LIBRA_SERVICE_TOKEN:-}
      # Rotación sin corte (libraauth v0.52.0): mientras está definida, la
      # instancia acepta el token nuevo y el anterior. Vacía no vale nada. La
      # maneja `panel_admin.py token-servicio <slug> --rotar|--cerrar`.
      - LIBRA_SERVICE_TOKEN_ANTERIOR=${LIBRA_SERVICE_TOKEN_ANTERIOR:-}
      # 🔑 La credencial de INTEGRACIÓN (header `x-integracion-auth`), aparte de
      # la de servicio: con ella otra instancia de la familia (MedLibra,
      # LibraDesk) registra consultas y deposita comprobantes, y nada más —no
      # abre usuarios, SMTP ni el tema—. Una por instancia; el emisor la recibe
      # con `panel_admin.py vincular-integracion`. Default vacío por lo mismo que
      # la de arriba: sin valor, el header no sirve.
      - LIBRA_INTEGRACION_TOKEN=${LIBRA_INTEGRACION_TOKEN:-}
      - LIBRA_INTEGRACION_TOKEN_ANTERIOR=${LIBRA_INTEGRACION_TOKEN_ANTERIOR:-}
      # Recuperacion de contrasena (libraauth v0.5.0). Sin SMTP la app
      # levanta igual y POST /api/forgot-password devuelve 503: cargar
      # estas variables es lo unico que falta para que mande mails.
      - CONTALIBRA_RESET_URL_BASE=${CONTALIBRA_RESET_URL_BASE:-https://dev.contalibra.com.ar/reset-password}
      - LIBRAAUTH_SMTP_HOST=${LIBRAAUTH_SMTP_HOST:-}
      - LIBRAAUTH_SMTP_PORT=${LIBRAAUTH_SMTP_PORT:-587}
      - LIBRAAUTH_SMTP_USER=${LIBRAAUTH_SMTP_USER:-}
      - LIBRAAUTH_SMTP_PASSWORD=${LIBRAAUTH_SMTP_PASSWORD:-}
      - LIBRAAUTH_SMTP_FROM_EMAIL=${LIBRAAUTH_SMTP_FROM_EMAIL:-}
      - LIBRAAUTH_SMTP_FROM_NAME=${LIBRAAUTH_SMTP_FROM_NAME:-Contalibra}
      # Que cada linea del registro de errores (`DATA_DIR/errores/errores.jsonl`, ADR-045 de libracore) diga de que
      # instancia viene. Las de cliente y demo las reciben del panel en cada `actualizar`; esta no pasa por el panel.
      - LIBRA_ENTORNO=dev
      - LIBRA_INSTANCIA=contalibra-dev
      - LIBRA_VERSION=${LIBRA_VERSION:-dev}
    networks:
      - stack-net
      - datos

volumes:
  contalibra-postgres-data:

networks:
  datos:
    name: contalibra-dev-datos
  stack-net:
    external: true
    name: stack_stack-net
