services:
  contalibra-dev:
    build: .
    container_name: contalibra-dev
    restart: unless-stopped
    # Límites agregados tras cruzar la auditoría de Restolibra (ver
    # wiki/analyses/restolibra-auditoria-produccion): sin esto, un contenedor
    # de Contalibra sin tope puede consumir toda la RAM/CPU del VPS y tumbar
    # a Restolibra (y viceversa), que comparten el mismo host.
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "8071:8000"
    volumes:
      - ./:/app
    command: uvicorn web.app:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - SECRET_KEY=${SECRET_KEY:-contalibra-dev-secret}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_NOMBRE=${ADMIN_NOMBRE:-Administrador}
      - DATA_DIR=/app/dev-data
      - ENV=development
      - DOCS_AUTH_SECRET=${DOCS_AUTH_SECRET:-}
    networks:
      - stack-net

networks:
  stack-net:
    external: true
    name: stack_stack-net
