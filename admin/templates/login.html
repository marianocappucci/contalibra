<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar — Backoffice Contalibra</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/vendor/material-symbols/material-symbols-outlined.css" rel="stylesheet">
  <style> body { background:#1a1a2e; } </style>
</head>
<body>
  <div class="container" style="max-width:400px; margin-top:12vh;">
    <div class="card shadow">
      <div class="card-body p-4">
        <h1 class="h4 text-center mb-1"><span class="material-symbols-outlined me-2">dns</span>Backoffice</h1>
        <p class="text-center text-muted small mb-4">Contalibra · gestión de clientes y planes</p>
        {% if error == "2" %}
        <div class="alert alert-danger py-2 small">Demasiados intentos fallidos. Esperá unos minutos e intentá de nuevo.</div>
        {% elif error %}
        <div class="alert alert-danger py-2 small">Usuario o contraseña incorrectos.</div>
        {% endif %}
        <form method="post" action="/login">
          <div class="mb-3">
            <label class="form-label fw-semibold">Usuario</label>
            <input type="text" name="username" class="form-control" autofocus required>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Contraseña</label>
            <div class="input-group">
              <input type="password" id="password" name="password" class="form-control" required>
              <button type="button" class="btn btn-outline-secondary" id="toggle-password" aria-label="Mostrar contraseña">
                <span class="material-symbols-outlined" id="toggle-password-icon">visibility</span>
              </button>
            </div>
          </div>
          <button class="btn btn-primary w-100"><span class="material-symbols-outlined me-1">login</span>Ingresar</button>
        </form>
      </div>
    </div>
  </div>
  <script>
    document.getElementById('toggle-password').addEventListener('click', function () {
      const input = document.getElementById('password');
      const icon = document.getElementById('toggle-password-icon');
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      icon.textContent = isHidden ? 'visibility_off' : 'visibility';
      this.setAttribute('aria-label', isHidden ? 'Ocultar contraseña' : 'Mostrar contraseña');
    });
  </script>
</body>
</html>
